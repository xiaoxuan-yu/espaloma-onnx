name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - run: uv sync --locked
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run python -c 'import os,importlib.metadata; assert os.environ["RELEASE_TAG"] == "v"+importlib.metadata.version("espaloma-onnx")'
      - uses: ./.github/actions/build-model
      - run: uv run pytest -q
      - name: Install optional OpenFF parameter environment
        run: |
          pixi install -e fullff --locked
          uv pip install --python .pixi/envs/fullff/bin/python -e .
      - name: Validate full parameters without OpenMM or training imports
        run: pixi run -e fullff python benchmarks/smoke_full_forcefield.py
      - name: Validate optional OpenMM wheel backend
        run: |
          pixi run -e fullff espaloma-onnx CCO --model .artifacts/model --full-forcefield > .artifacts/ethanol.json
          uv run --extra openmm python -c 'import json; from espaloma_onnx.openmm_backend import create_system; from openmm import XmlSerializer,Context,VerletIntegrator,Platform; s=create_system(json.load(open(".artifacts/ethanol.json"))); assert s.getNumParticles()==9; s=XmlSerializer.deserialize(XmlSerializer.serialize(s)); i=VerletIntegrator(0.001); c=Context(s,i,Platform.getPlatformByName("Reference")); print("Optional OpenMM CPU backend: PASS")' 
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: model-assets
          path: .artifacts/model/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  huggingface:
    needs: build
    runs-on: ubuntu-latest
    environment: model-hubs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: model-assets
          path: .artifacts/model/
      - name: Publish model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --with huggingface-hub scripts/publish_models.py hf
  modelscope:
    needs: build
    runs-on: ubuntu-latest
    environment: model-hubs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: model-assets
          path: .artifacts/model/
      - name: Publish model
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_REPO_ID: ${{ vars.MODELSCOPE_REPO_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --with modelscope scripts/publish_models.py ms
