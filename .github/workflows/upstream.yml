name: Check upstream model
on:
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - run: uv sync --locked
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_upstream.py
      - if: steps.check.outputs.changed == 'true'
        uses: ./.github/actions/build-model
      - if: steps.check.outputs.changed == 'true'
        run: uv run pytest -q
      - if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-model-candidate
          path: .artifacts/model/
      - if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-candidate-metadata
          path: model-metadata/
