name: Check upstream model
on:
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - run: uv sync --locked
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_upstream.py
      - if: steps.check.outputs.changed == 'true'
        uses: ./.github/actions/build-model
      - if: steps.check.outputs.changed == 'true'
        run: uv run pytest -q
      - if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-model-candidate
          path: .artifacts/model/
      - if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upstream-model
          commit-message: 'Update upstream model provenance'
          title: 'Update upstream Espaloma model'
          body: 'Upstream model changed. Candidate export and current reference checks passed. Review model support, package version and validation data before releasing.'
          add-paths: model-metadata/
