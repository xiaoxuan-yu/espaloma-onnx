name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - run: uv sync --locked
      - uses: ./.github/actions/build-model
      - run: uv run pytest -q
      - name: Install optional OpenFF parameter environment
        run: |
          pixi install -e fullff --locked
          uv pip install --python .pixi/envs/fullff/bin/python -e .
      - name: Validate full parameters without OpenMM or training imports
        run: pixi run -e fullff python benchmarks/smoke_full_forcefield.py
      - run: uv build
      - run: uv run --with twine twine check dist/*
