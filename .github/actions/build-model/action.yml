name: Build model
description: Export and stage a verified ONNX model
runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: v0.68.1
        cache: true
    - shell: bash
      run: uv run python scripts/download_checkpoint.py
    - shell: bash
      run: pixi run export
    - shell: bash
      run: uv run python scripts/stage_model.py
