[workspace]
name = "espaloma-export"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
espaloma = "==0.3.2"
dgl = "==2.3.0"
pytorch = {version = "==2.3.1", build = "cpu*"}
numpy = "<2"
torchdata = "==0.7.1"
setuptools = "<81"
onnx = ">=1.15,<1.18"

[tasks]
export = "python scripts/export_model.py"
